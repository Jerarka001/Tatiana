<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Para ti</title>
  <link rel="stylesheet" href="styles.css" />

<body>

  <!-- LANDING: pantalla de acceso -->
  <section id="landing" class="landing">
    <div class="landing-bg"></div>
    <div class="landing-card">
      <p class="landing-question">¿Me amas?</p>
      <input type="text" id="accessInput" class="landing-input" placeholder="Escribe la respuesta..." autocomplete="off" />
      <p id="accessError" class="landing-error">Piensalo de nuevo :(</p>
      <button id="accessBtn" class="landing-btn">Entrar</button>
    </div>
  </section>

  <!-- PÁGINA PRINCIPAL -->
  <main id="main" class="main hidden">

    <!-- Zona superior: texto animado -->
    <header class="main-top">
      <h1 class="animated-title" id="animatedTitle"></h1>
    </header>

    <!-- Zona central: carrusel polaroid -->
    <section class="carousel-wrapper">
      <div class="carousel-track" id="carouselTrack">
        <!-- Las fotos se inyectan desde JS -->
      </div>
    </section>

    <!-- Zona inferior: frases cambiantes -->
    <footer class="main-bottom">
      <p class="changing-phrase" id="changingPhrase"></p>
    </footer>

    <!-- Decoraciones laterales -->
    <div class="side-deco side-deco--left"></div>
    <div class="side-deco side-deco--right"></div>

      <div class="bg-blossom bg-blossom--2"></div>
      <div class="bg-blossom bg-blossom--3"></div>
